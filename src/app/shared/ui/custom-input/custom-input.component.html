<div class="w-full mb-3">
  @if (label) {
    <label class="block text-sm font-semibold text-gray-800 mb-1.5">
      {{ label }}
    </label>
  }

  <input
  [type]="type"
  [placeholder]="placeholder"
  [value]="value"

  [class.border-red-500]="hasError"
  [class.border-gray-300]="!hasError"

  (input)="onChange($any($event.target).value)"
  (blur)="onTouched()"

  class="w-full px-4 py-3.5 border rounded-xl focus:outline-none text-sm text-gray-900 placeholder-gray-400 bg-white transition-all duration-200 shadow-sm [color-scheme:light] [&::-webkit-calendar-picker-indicator]:cursor-pointer"
/>
</div>
